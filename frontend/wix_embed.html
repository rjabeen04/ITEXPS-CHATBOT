<style>
html, body {
    background: transparent !important;
    margin: 0; padding: 0;
    display: flex;
    justify-content: flex-end;
    align-items: flex-end;
    height: 100vh;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

#reopen-btn {
    display: inline-block;
    background: #004a99;
    color: #fff;
    border: none;
    padding: 14px 30px;
    border-radius: 30px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 12px;
    box-shadow: 0 4px 12px rgba(0,74,153,0.3);
}
#reopen-btn:hover { background: #003377; }

.chat-container {
    width: 350px;
    height: 380px;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    overflow: hidden;
    border: 1px solid #004a99;
    display: flex;
    flex-direction: column;
}

.chat-header {
    background-color: #004a99;
    color: #ffffff;
    padding: 12px 16px;
    font-weight: bold;
    font-size: 15px;
    border-bottom: 3px solid #ffcc00;
    display: flex;
    align-items: center;
    gap: 8px;
}
.chat-header .dot { width: 8px; height: 8px; background: #4cff91; border-radius: 50%; }
.chat-header .close-btn {
    margin-left: auto;
    background: none;
    border: none;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    opacity: 0.7;
}
.chat-header .close-btn:hover { opacity: 1; }

.messages-container {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    background-color: #f9f9f9;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    scroll-behavior: smooth;
}

.msg-user, .msg-bot { display: flex; width: 100%; position: relative; z-index: 1; }
.msg-user { justify-content: flex-end; }
.msg-bot  { justify-content: flex-start; }

.bubble {
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 80%;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
}
.msg-user .bubble { background: #004a99; color: #fff; border-bottom-right-radius: 3px; }
.msg-bot  .bubble { background: #e5e5ea; color: #111; border-bottom-left-radius: 3px; }

#input-row {
    display: flex;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid #ddd;
    background: #ffffff;
    align-items: center;
}
#q {
    flex: 1;
    padding: 9px 14px;
    border: 1px solid #bad3eb;
    background: #e1ecf7;
    border-radius: 20px;
    font-size: 14px;
    outline: none;
}
#q:focus { border-color: #004a99; }
#send-btn {
    padding: 9px 18px;
    background: #004a99;
    color: #fff;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    font-weight: bold;
    font-size: 14px;
}
#send-btn:disabled { background: #aaa; cursor: not-allowed; }

#chat-wrapper {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
}
</style>

<div id="chat-wrapper">
    <button id="reopen-btn">💬 Chat with ITExps</button>
    <div class="chat-container" id="chat-center">
        <div class="chat-header">
            <div class="dot"></div>
            ITExps Assistant
            <button class="close-btn" id="close-btn">✕</button>
        </div>
        <div class="messages-container" id="chat-box">
            <div class="msg-bot"><div class="bubble">Hello! I am your ITExps assistant. How can I help you today?</div></div>
        </div>
        <div id="input-row">
            <input type="text" id="q" placeholder="Ask a question..." autocomplete="off">
            <button id="send-btn">Send</button>
        </div>
    </div>
</div>

<script>
const chatBox    = document.getElementById('chat-box');
const queryInput = document.getElementById('q');
const sendBtn    = document.getElementById('send-btn');
const chatCenter = document.getElementById('chat-center');
const reopenBtn  = document.getElementById('reopen-btn');
const API_URL = "/api/chat";


document.getElementById('close-btn').addEventListener('click', () => {
    chatCenter.style.display = 'none';
});

reopenBtn.addEventListener('click', () => {
    const isOpen = chatCenter.style.display !== 'none';
    chatCenter.style.display = isOpen ? 'none' : 'flex';
});

async function sendMessage() {
    const text = queryInput.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    queryInput.value = '';
    sendBtn.disabled = true;
    try {
        const res = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ question: text })
        });
        const data = await res.json();
        addMessage(data.answer || "Sorry, I couldn't process that.", 'bot');
    } catch {
        addMessage("Connection error. Please try again later.", 'bot');
    } finally {
        sendBtn.disabled = false;
    }
}

function addMessage(text, sender) {
    const wrapper = document.createElement('div');
    wrapper.className = `msg-${sender}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    // Extract links before escaping, restore after
    const links = [];
    const withPlaceholders = text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (_, title, url) => {
        links.push(`<a href="${url}" target="_blank" style="color:#004a99;text-decoration:underline;">${title}</a>`);
        return `%%LINK${links.length - 1}%%`;
    });
    bubble.innerHTML = withPlaceholders
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\n/g, '<br>')
        .replace(/%%LINK(\d+)%%/g, (_, i) => links[i]);
    wrapper.appendChild(bubble);
    chatBox.appendChild(wrapper);
    chatBox.scrollTop = chatBox.scrollHeight;
}

sendBtn.addEventListener('click', sendMessage);
queryInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });
</script>
